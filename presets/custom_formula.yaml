#custom formula initial condition with 4th order exact splitting

domain:
  L: 10.0
  N: 256
pde:
  kappa: 0.8
initial_condition:
  type: custom
  params:
    formula_real: "a * exp(-(x - x0)**2 / (2 * sigma**2)) * tan(k * x)"
    formula_imag: "a * exp(-(x - x0)**2 / (2 * sigma**2)) * tanh(k * x)"
    params:
      a: 1.0
      x0: 0.0
      sigma: 2.0
      k: 0.5
time:
  dt: 0.001
  n_steps: 200
strategy:
  name: strang
  ordering: LN
  splitting_order: 4
  linear_substeps: 1
  nonlinear_substeps: 1
linear:
  type: exact
nonlinear:
  type: exact
reference:
  mode: on
reference:
  mode: on
compute:
  use_gpu: false